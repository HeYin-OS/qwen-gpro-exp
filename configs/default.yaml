# Default hyperparameters for a single-GPU GRPO run over Qwen2.5.
# Mirrors TrainConfig in src/qwen_grpo/train.py; edit here to keep runs
# reproducible without touching code.

model_name: Qwen/Qwen2.5-1.5B-Instruct
output_dir: outputs/grpo

# Dataset
train_size: 7200
test_size: 500
seed: 42

# Online rollout (group sampling)
num_generations: 8          # candidates per prompt = GRPO group size
max_completion_length: 512

# Rollout sampling
temperature: 1.0
top_p: 1.0

# GRPO optimization
learning_rate: 1.0e-5
per_device_train_batch_size: 8
gradient_accumulation_steps: 8
num_train_epochs: 1
beta: 0.04                  # KL regularization vs reference policy
epsilon: 0.2                # PPO-style clip
loss_type: dapo

# PEFT / LoRA (base model frozen)
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

# Memory control on a single card
bf16: true
gradient_checkpointing: true

# Logging / checkpoints
logging_steps: 5
save_steps: 100
save_total_limit: 3
log_completions: true
